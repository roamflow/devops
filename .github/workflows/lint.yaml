name: lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar -xz
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: Helm Lint
        run: |
          for app in apps/*; do
            if [ -f "$app/Chart.yaml" ]; then
              echo "==> Linting $app"
              helm lint "$app"
            fi
          done

      - name: Kustomize Build
        run: |
          echo "==> Testing Kustomize infrastructure"
          kubectl kustomize infrastructure/ > /dev/null
          echo "==> Testing Kustomize clusters/roamflow"
          kubectl kustomize clusters/roamflow/ > /dev/null

      - name: Kubeconform Schema Validation (Helm Apps)
        run: |
          for app in apps/*; do
            if [ -f "$app/Chart.yaml" ]; then
              echo "==> Validating $app with kubeconform"
              helm template test-release "$app" | kubeconform -summary -ignore-missing-schemas -kubernetes-version 1.31.0
            fi
          done

      - name: Kubeconform Schema Validation (Infrastructure & Clusters)
        run: |
          echo "==> Validating infrastructure manifests"
          kubectl kustomize infrastructure/ | kubeconform -summary -ignore-missing-schemas -kubernetes-version 1.31.0
          echo "==> Validating clusters/roamflow manifests"
          kubectl kustomize clusters/roamflow/ | kubeconform -summary -ignore-missing-schemas -kubernetes-version 1.31.0
