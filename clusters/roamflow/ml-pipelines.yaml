apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ml-pipelines
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/roamflow/devops.git
    targetRevision: main
    path: apps/ml-pipelines
  destination:
    server: https://kubernetes.default.svc
    namespace: dagster
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
