stirling-pdf-chart:
  image:
    registry: docker.io
    repository: stirlingtools/stirling-pdf
    tag: latest
  ingress:
    enabled: true
    ingressClassName: traefik
    pathType: Prefix
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      traefik.ingress.kubernetes.io/router.middlewares: kube-system-redirect-https@kubernetescrd
    hosts:
      - name: pdf.duylai.duckdns.org
        path: /
        tls: true
        tlsSecret: pdf-tls
  envs:
    - name: UI_APPNAME
      value: "Stirling PDF"
    - name: SYSTEM_DEFAULTLOCALE
      value: "en-US"
    - name: FAT_DOCKER
      value: "true"
    - name: SYSTEM_MAXFILESIZE
      value: "500"
    - name: SECURITY_ENABLELOGIN
      value: "false"
  probes:
    liveness:
      enabled: true
      initialDelaySeconds: 120
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 6
    readiness:
      enabled: true
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
  resources:
    limits:
      cpu: 2000m
      memory: 2048Mi
    requests:
      cpu: 100m
      memory: 512Mi
