kube-prometheus-stack:
  # Disable scrapers for components that run embedded inside K3s binary
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  kubeEtcd:
    enabled: false

  # Disable alertmanager to save memory (can be re-enabled anytime)
  alertmanager:
    enabled: false

  # Hardware node monitoring (CPU, RAM, Disk, Net on roamflow-1 and roamflow-2)
  nodeExporter:
    enabled: true

  # Kubernetes cluster state metrics (Pods, Deployments, PVCs, Nodes)
  kubeStateMetrics:
    enabled: true

  # Prometheus Core Engine
  prometheus:
    enabled: true
    prometheusSpec:
      retention: 7d
      retentionSize: "10GiB"
      resources:
        limits:
          cpu: 1000m
          memory: 1024Mi
        requests:
          cpu: 100m
          memory: 256Mi
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi

  # Grafana Visualization Dashboards & Authentik SSO
  grafana:
    enabled: true
    adminPassword: "prom-operator"
    additionalDataSources:
      - name: Loki
        type: loki
        access: proxy
        url: http://monitoring-loki:3100
        isDefault: false
        jsonData:
          maxLines: 1000
    envFromSecret: "grafana-secrets"
    grafana.ini:
      server:
        root_url: "https://grafana.duylai.duckdns.org"
      auth.generic_oauth:
        enabled: true
        name: "Authentik"
        allow_sign_up: true
        client_id: "grafana"
        scopes: "openid profile email"
        auth_url: "https://auth.duylai.duckdns.org/application/o/authorize/"
        token_url: "https://auth.duylai.duckdns.org/application/o/token/"
        api_url: "https://auth.duylai.duckdns.org/application/o/userinfo/"
        role_attribute_path: "contains(groups[*], 'authentik Admins') && 'Admin' || contains(groups[*], 'Grafana Admins') && 'Admin' || 'Editor'"
        allow_assign_grafana_admin: true
    persistence:
      enabled: true
      storageClassName: local-path
      size: 2Gi
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
        traefik.ingress.kubernetes.io/router.middlewares: kube-system-redirect-https@kubernetescrd
      hosts:
        - grafana.duylai.duckdns.org
      tls:
        - secretName: grafana-tls
          hosts:
            - grafana.duylai.duckdns.org
    resources:
      limits:
        cpu: 1000m
        memory: 1536Mi
      requests:
        cpu: 100m
        memory: 256Mi

loki:
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    storage_config:
      filesystem:
        directory: /var/loki/chunks
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    compactor:
      retention_enabled: true
      retention_delete_delay: 2h
      delete_request_store: filesystem
    limits_config:
      retention_period: 168h
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 5Gi
      storageClass: local-path
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  ingester:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  distributor:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0
  bloomCompactor:
    replicas: 0
  bloomGateway:
    replicas: 0
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  gateway:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false

promtail:
  config:
    clients:
      - url: http://monitoring-loki:3100/loki/api/v1/push
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 96Mi
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
      operator: Exists
    - effect: NoSchedule
      key: node-role.kubernetes.io/master
      operator: Exists
