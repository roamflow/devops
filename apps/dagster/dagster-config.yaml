apiVersion: v1
kind: ConfigMap
metadata:
  name: dagster-config
  namespace: dagster
data:
  dagster.yaml: |
    scheduler:
      module: dagster.core.scheduler
      class: DagsterDaemonScheduler

    run_coordinator:
      module: dagster.core.run_coordinator
      class: QueuedRunCoordinator

    run_launcher:
      module: dagster.core.launcher
      class: DefaultRunLauncher

    telemetry:
      enabled: false

    storage:
      postgres:
        postgres_db:
          hostname: dagster-postgresql
          username: dagster
          password:
            env: DAGSTER_PG_PASSWORD
          db_name: dagster
          port: 5432

  workspace.yaml: |
    load_from:
      - python_file:
          relative_path: /opt/dagster/app/repo.py
          location_name: sample_project

  repo.py: |
    import os
    from dagster import asset, Definitions
    import mlflow

    @asset
    def sample_ml_asset():
        """A sample Dagster asset demonstrating integrated tracking with internal MLflow."""
        mlflow_tracking_uri = os.getenv("MLFLOW_TRACKING_URI", "http://mlflow.mlflow.svc.cluster.local:5000")
        mlflow.set_tracking_uri(mlflow_tracking_uri)
        try:
            with mlflow.start_run(run_name="dagster_orchestrated_run"):
                mlflow.log_param("orchestrator", "dagster")
                mlflow.log_param("source", "roamflow-k8s")
                mlflow.log_metric("val_accuracy", 0.985)
                mlflow.log_metric("loss", 0.015)
        except Exception as err:
            print(f"MLflow logging info: {err}")
        return {"status": "success", "processed_records": 1000}

    defs = Definitions(
        assets=[sample_ml_asset],
    )
