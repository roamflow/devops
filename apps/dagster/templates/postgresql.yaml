apiVersion: apps/v1
kind: Deployment
metadata:
  name: dagster-postgresql
  labels:
    {{- include "dagster.labels" . | nindent 4 }}
    app: dagster-postgresql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dagster-postgresql
  template:
    metadata:
      labels:
        app: dagster-postgresql
    spec:
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image | quote }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: {{ .Values.postgresql.secretName }}
          ports:
            - name: postgresql
              containerPort: 5432
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - dagster
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - dagster
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgresql-data
          persistentVolumeClaim:
            claimName: dagster-postgresql-data
---
apiVersion: v1
kind: Service
metadata:
  name: dagster-postgresql
  labels:
    {{- include "dagster.labels" . | nindent 4 }}
    app: dagster-postgresql
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgresql
  selector:
    app: dagster-postgresql
