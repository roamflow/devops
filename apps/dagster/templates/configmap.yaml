apiVersion: v1
kind: ConfigMap
metadata:
  name: dagster-config
  labels:
    {{- include "dagster.labels" . | nindent 4 }}
    app: dagster
data:
  dagster.yaml: |
    scheduler:
      module: dagster.core.scheduler
      class: DagsterDaemonScheduler

    run_coordinator:
      module: dagster.core.run_coordinator
      class: QueuedRunCoordinator

    run_launcher:
      module: dagster.core.launcher
      class: DefaultRunLauncher

    telemetry:
      enabled: false

    storage:
      postgres:
        postgres_db:
          hostname: dagster-postgresql
          username: dagster
          password:
            env: DAGSTER_PG_PASSWORD
          db_name: dagster
          port: 5432

  workspace.yaml: |
    load_from:
      {{- if .Values.workspace.grpcServers }}
      {{- range .Values.workspace.grpcServers }}
      - grpc_server:
          host: {{ .host | quote }}
          port: {{ .port }}
          location_name: {{ .locationName | quote }}
      {{- end }}
      {{- else }}
      []
      {{- end }}
