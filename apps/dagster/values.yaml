postgresql:
  image: postgres:16-alpine
  storage: 5Gi
  storageClassName: local-path
  secretName: dagster-postgresql-secret
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

dagster:
  image: python:3.11-slim
  storageClassName: local-path
  venvStorage: 5Gi
  runStorage: 5Gi
  webserver:
    port: 3000
    resources:
      requests:
        cpu: 150m
        memory: 384Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  daemon:
    resources:
      requests:
        cpu: 150m
        memory: 384Mi
      limits:
        cpu: 1000m
        memory: 1Gi

ingress:
  enabled: true
  className: traefik
  host: dagster.duylai.duckdns.org
  tlsSecretName: dagster-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-redirect-https@kubernetescrd,kube-system-authentik-auth@kubernetescrd

# External gRPC code locations (populated when deploying separate user code location repos)
workspace:
  grpcServers: []
  # Example:
  # grpcServers:
  #   - host: dagster-pipeline-code
  #     port: 4000
  #     locationName: iris_pipeline
