apiVersion: v1
kind: Namespace
metadata:
  name: changedetection
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: changedetection-data
  namespace: changedetection
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: changedetection
  namespace: changedetection
  labels:
    app: changedetection
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: changedetection
  template:
    metadata:
      labels:
        app: changedetection
    spec:
      containers:
      - name: changedetection
        image: ghcr.io/dgtlmoon/changedetection.io:latest
        imagePullPolicy: IfNotPresent
        env:
          - name: BASE_URL
            value: "https://changedetection.duylai.duckdns.org"
          - name: PORT
            value: "5000"
          - name: HIDE_REFERER
            value: "true"
        ports:
        - name: http
          containerPort: 5000
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
        - name: datastore
          mountPath: /datastore
      volumes:
      - name: datastore
        persistentVolumeClaim:
          claimName: changedetection-data
---
apiVersion: v1
kind: Service
metadata:
  name: changedetection
  namespace: changedetection
  labels:
    app: changedetection
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
    name: http
  selector:
    app: changedetection
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: changedetection-ingress
  namespace: changedetection
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-redirect-https@kubernetescrd,kube-system-authentik-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - changedetection.duylai.duckdns.org
    secretName: changedetection-tls
  rules:
  - host: changedetection.duylai.duckdns.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: changedetection
            port:
              number: 5000
