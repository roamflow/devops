apiVersion: v1
kind: Namespace
metadata:
  name: vikunja
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vikunja-data
  namespace: vikunja
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vikunja-config
  namespace: vikunja
data:
  config.yml: |
    service:
      publicurl: "https://tasks.duylai.duckdns.org/"
      enableregistration: false
    database:
      type: "sqlite"
      path: "/app/vikunja/files/vikunja.db"
    files:
      basepath: "/app/vikunja/files"
    auth:
      local:
        enabled: true
      openid:
        enabled: true
        redirecturl: "https://tasks.duylai.duckdns.org/auth/openid/"
        providers:
          authentik:
            name: "Authentik"
            authurl: "https://auth.duylai.duckdns.org/application/o/vikunja/"
            clientid: "7rrOh2KNtQvAIawxxT3Hyr3ISG8vK4lO9iLVhnNN"
            clientsecret: "xQHe0HRz8jHuRBsKWpznnzEdcGerj3x6CTyZAR1C2KpDN01Sfx60VGg8YGgoS49RBbU5OiYbgeCX0zUgM6vUjgwm2S6hWSh6Xz33EErIBSD1ZxxzJzDAK0ESDGwhg9bR"
            scope: "openid email profile"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja
  namespace: vikunja
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vikunja
  template:
    metadata:
      labels:
        app: vikunja
    spec:
      containers:
      - name: vikunja
        image: vikunja/vikunja:latest
        env:
        - name: VIKUNJA_SERVICE_PUBLICURL
          value: "https://tasks.duylai.duckdns.org/"
        - name: VIKUNJA_DATABASE_TYPE
          value: "sqlite"
        - name: VIKUNJA_DATABASE_PATH
          value: "/app/vikunja/files/vikunja.db"
        - name: VIKUNJA_FILES_BASEPATH
          value: "/app/vikunja/files"
        ports:
        - containerPort: 3456
          name: http
        volumeMounts:
        - name: data
          mountPath: /app/vikunja/files
        - name: config
          mountPath: /etc/vikunja
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 64Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: vikunja-data
      - name: config
        configMap:
          name: vikunja-config
---
apiVersion: v1
kind: Service
metadata:
  name: vikunja
  namespace: vikunja
spec:
  type: ClusterIP
  ports:
  - port: 3456
    targetPort: 3456
    name: http
  selector:
    app: vikunja
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vikunja-ingress
  namespace: vikunja
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - tasks.duylai.duckdns.org
    secretName: tasks-tls
  rules:
  - host: tasks.duylai.duckdns.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vikunja
            port:
              number: 3456
