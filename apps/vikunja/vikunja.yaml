apiVersion: v1
kind: Namespace
metadata:
  name: vikunja
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vikunja-data
  namespace: vikunja
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja
  namespace: vikunja
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vikunja
  template:
    metadata:
      labels:
        app: vikunja
    spec:
      containers:
      - name: vikunja
        image: vikunja/vikunja:latest
        env:
        - name: VIKUNJA_SERVICE_PUBLICURL
          value: "https://tasks.duylai.duckdns.org/"
        - name: VIKUNJA_DATABASE_TYPE
          value: "sqlite"
        - name: VIKUNJA_DATABASE_PATH
          value: "/app/vikunja/files/vikunja.db"
        - name: VIKUNJA_FILES_BASEPATH
          value: "/app/vikunja/files"
        ports:
        - containerPort: 3456
          name: http
        volumeMounts:
        - name: data
          mountPath: /app/vikunja/files
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 64Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: vikunja-data
---
apiVersion: v1
kind: Service
metadata:
  name: vikunja
  namespace: vikunja
spec:
  type: ClusterIP
  ports:
  - port: 3456
    targetPort: 3456
    name: http
  selector:
    app: vikunja
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vikunja-ingress
  namespace: vikunja
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - tasks.duylai.duckdns.org
    secretName: tasks-tls
  rules:
  - host: tasks.duylai.duckdns.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vikunja
            port:
              number: 3456
