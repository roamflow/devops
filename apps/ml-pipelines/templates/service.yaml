apiVersion: v1
kind: Service
metadata:
  name: ml-pipelines
  labels:
    {{- include "ml-pipelines.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 4000
      protocol: TCP
      name: grpc
  selector:
    {{- include "ml-pipelines.selectorLabels" . | nindent 4 }}
