replicaCount: 1

image:
  repository: ghcr.io/roamflow/ml-pipelines
  tag: "v0.1.0-166a68e"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 4000

env:
  MLFLOW_TRACKING_URI: "http://mlflow.mlflow.svc.cluster.local:5000"
  MLFLOW_EXPERIMENT_NAME: "iris-classification"
  MODEL_NAME: "iris-classifier"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

probes:
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
