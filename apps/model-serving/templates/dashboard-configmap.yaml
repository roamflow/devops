{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "model-serving.fullname" . }}-dashboard
  labels:
    {{- include "model-serving.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  model-serving.json: |-
{{ .Files.Get "dashboards/model-serving.json" | indent 4 }}
{{- end }}
