apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "mlflow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mlflow.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.postgresql.enabled }}
      initContainers:
        - name: wait-for-postgresql
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "Waiting for PostgreSQL to be ready at mlflow-postgresql:5432..."
              python -c '
              import socket, time
              for i in range(60):
                  try:
                      s = socket.create_connection(("mlflow-postgresql", 5432), timeout=2)
                      s.close()
                      print("PostgreSQL is reachable!")
                      exit(0)
                  except Exception:
                      time.sleep(2)
              print("Timed out waiting for PostgreSQL")
              exit(1)
              '
      {{- end }}
      containers:
        - name: mlflow
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              pip install --no-cache-dir psycopg2-binary
              exec mlflow server \
                --backend-store-uri {{ .Values.server.backendStoreUri | quote }} \
                {{- if .Values.server.artifactsDestination }}
                --artifacts-destination {{ .Values.server.artifactsDestination | quote }} \
                {{- end }}
                {{- if .Values.server.serveArtifacts }}
                --serve-artifacts \
                {{- end }}
                {{- if and .Values.server.defaultArtifactRoot (not .Values.server.artifactsDestination) }}
                --default-artifact-root {{ .Values.server.defaultArtifactRoot | quote }} \
                {{- end }}
                --host {{ .Values.server.host | quote }} \
                --port {{ .Values.server.port | quote }} \
                --workers {{ .Values.server.workers | quote }} \
                --allowed-hosts {{ .Values.server.allowedHosts | quote }} \
                --cors-allowed-origins {{ .Values.server.corsAllowedOrigins | quote }}
          env:
            - name: MLFLOW_PORT
              value: {{ .Values.server.port | quote }}
            {{- if .Values.postgresql.enabled }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.secretName }}
                  key: POSTGRES_PASSWORD
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.server.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.server.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: mlflow-storage
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: mlflow-storage
          persistentVolumeClaim:
            claimName: mlflow-data
      {{- end }}
